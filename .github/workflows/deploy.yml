name: Deploy to Vercel

# Builds and deploys from CI with a Vercel token, so any push to main deploys
# regardless of who authored it. Disconnect the Git repository in Vercel
# (Project Settings -> Git), or every push deploys twice.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun.lock is committed, so Vercel's install step may pick bun.
      - uses: oven-sh/setup-bun@v2

      # Vercel reads the author of HEAD and blocks deploys whose author isn't a
      # member of the Vercel project. Commit locally (never pushed) as the owner
      # so pushes from any collaborator deploy.
      - name: Dummy commit as the Vercel project owner
        run: |
          git config user.name "aryabharat"
          git config user.email "aryabharat33@gmail.com"
          git commit --allow-empty -m "deploy: ${GITHUB_SHA::7} by ${GITHUB_ACTOR}"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel project settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The Lovable vite config defaults nitro to cloudflare-module, and nitro only
      # auto-detects Vercel on Vercel's own builders, so set the preset here.
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

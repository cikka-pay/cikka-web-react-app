<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cikka 3D Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.8s ease;
    }
    body.light-theme {
      background: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
    }
    .controls-bar {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
    }
    body.light-theme .controls-bar {
      background: rgba(245, 245, 248, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .btn-ctrl {
      padding: 9px 16px;
      border-radius: 30px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      background: transparent;
      color: rgba(255,255,255,0.75);
    }
    body.light-theme .btn-ctrl {
      color: rgba(0,0,0,0.75);
    }
    .btn-ctrl.active {
      background: #7c3aed;
      color: #fff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    }
    body.light-theme .btn-ctrl.active-gold {
      background: #d97706;
      color: #fff;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
    }
    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      transition: color 0.4s ease;
    }
    body.light-theme .hint {
      color: rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body id="page-body">

<div class="controls-bar" id="controls">
  <button id="btn-theme-dark" class="btn-ctrl active" onclick="window.setTheme('dark')">Black BG (Purple & White)</button>
  <button id="btn-theme-light" class="btn-ctrl" onclick="window.setTheme('light')">White BG (Black & Gold)</button>
  <button id="btn-mode" class="btn-ctrl" onclick="window.triggerTransformation()" style="border: 1px solid rgba(168, 85, 247, 0.4); color: #d8b4fe;">↻ 3D Morph (Cikka ⇄ ₹)</button>
</div>

<div id="canvas-container"></div>
<div class="hint">Stable 3D Position &bull; Smooth Color Shift (Purple/White ⇄ Black/Gold)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function () {
  const container = document.getElementById('canvas-container');
  const body = document.getElementById('page-body');
  const W = window.innerWidth;
  const H = window.innerHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 1000);
  camera.position.set(0, 0, 750);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.8;
  controls.minDistance = 300;
  controls.maxDistance = 1200;

  // Pure 1.05 ambient light preserves exact rich brand colors
  const ambient = new THREE.AmbientLight(0xffffff, 1.05);
  scene.add(ambient);

  const bevelLight = new THREE.DirectionalLight(0xffffff, 0.35);
  bevelLight.position.set(120, 220, 350);
  scene.add(bevelLight);

  // ─── Color Palettes for Smooth Dynamic Shifting ─────────────────────
  // 1. Black BG: Purple & White/Lavender
  const darkPalette = [
    new THREE.Color('#decff2'), // 0.00: Top-right light lavender / white
    new THREE.Color('#c4b1e5'), // 0.12
    new THREE.Color('#a682db'), // 0.28
    new THREE.Color('#8e5ccf'), // 0.48
    new THREE.Color('#7337bd'), // 0.68
    new THREE.Color('#591cb0'), // 0.85
    new THREE.Color('#420b8c')  // 1.00: Bottom-left deep violet/purple
  ];

  // 2. White BG: Black & Gold ("purple to black, white to gold")
  const lightPalette = [
    new THREE.Color('#fbbf24'), // 0.00: Top-right rich bright gold (from white)
    new THREE.Color('#f59e0b'), // 0.12: Warm gold
    new THREE.Color('#d97706'), // 0.28: Deep golden amber
    new THREE.Color('#92400e'), // 0.48: Antique bronze gold
    new THREE.Color('#451a03'), // 0.68: Dark mahogany/bronze
    new THREE.Color('#1c1917'), // 0.85: Rich charcoal black
    new THREE.Color('#050508')  // 1.00: Pure deep black (from purple)
  ];

  const sideDarkColor = new THREE.Color('#380c5e');
  const sideLightColor = new THREE.Color('#1c1917');
  const stops = [0.00, 0.12, 0.28, 0.48, 0.68, 0.85, 1.00];

  function lerpColor(cA, cB, t) {
    const res = new THREE.Color();
    res.r = THREE.MathUtils.lerp(cA.r, cB.r, t);
    res.g = THREE.MathUtils.lerp(cA.g, cB.g, t);
    res.b = THREE.MathUtils.lerp(cA.b, cB.b, t);
    return res;
  }

  function colorToHex(c) {
    return '#' + c.getHexString();
  }

  // Continuous Brand Gradient Canvas
  const logoCanvas = document.createElement('canvas');
  logoCanvas.width = 512;
  logoCanvas.height = 512;
  const logoCtx = logoCanvas.getContext('2d');

  function renderGradient(t) {
    const grad = logoCtx.createLinearGradient(560, -30, 0, 520);
    for (let i = 0; i < stops.length; i++) {
      const c = lerpColor(darkPalette[i], lightPalette[i], t);
      grad.addColorStop(stops[i], colorToHex(c));
    }
    logoCtx.fillStyle = grad;
    logoCtx.fillRect(0, 0, 512, 512);
  }
  renderGradient(0);

  const logoTexture = new THREE.CanvasTexture(logoCanvas);
  logoTexture.encoding = THREE.sRGBEncoding;

  const frontMat = new THREE.MeshStandardMaterial({
    map: logoTexture,
    roughness: 1.0,
    metalness: 0.0
  });

  const sideMat = new THREE.MeshStandardMaterial({
    color: sideDarkColor.clone(),
    roughness: 1.0,
    metalness: 0.0
  });

  const extrudeSettings = {
    depth: 25,
    bevelEnabled: true,
    bevelThickness: 2.2,
    bevelSize: 1.8,
    bevelOffset: 0,
    bevelSegments: 4,
  };

  function to3D(x, y) {
    return [x - 250, -(y - 250)];
  }

  const pixelPerfectUVGenerator = {
    generateTopUV: function(geometry, vertices, indexA, indexB, indexC) {
      const ax = (vertices[indexA * 3] + 250) / 500;
      const ay = (vertices[indexA * 3 + 1] + 250) / 500;
      const bx = (vertices[indexB * 3] + 250) / 500;
      const by = (vertices[indexB * 3 + 1] + 250) / 500;
      const cx = (vertices[indexC * 3] + 250) / 500;
      const cy = (vertices[indexC * 3 + 1] + 250) / 500;
      return [
        new THREE.Vector2(ax, ay),
        new THREE.Vector2(bx, by),
        new THREE.Vector2(cx, cy)
      ];
    },
    generateSideWallUV: function(geometry, vertices, indexA, indexB, indexC, indexD) {
      return [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(1, 0),
        new THREE.Vector2(1, 1),
        new THREE.Vector2(0, 1)
      ];
    }
  };

  function createShapeMesh(points, extrudeOpts) {
    const shape = new THREE.Shape();
    const p0 = to3D(points[0][0], points[0][1]);
    shape.moveTo(p0[0], p0[1]);
    for (let i = 1; i < points.length; i++) {
      const p = to3D(points[i][0], points[i][1]);
      shape.lineTo(p[0], p[1]);
    }
    shape.closePath();

    const geom = new THREE.ExtrudeGeometry(shape, {
      ...extrudeOpts,
      UVGenerator: pixelPerfectUVGenerator
    });

    return new THREE.Mesh(geom, [frontMat, sideMat]);
  }

  // 1. Top Wing Polygon
  const topWingPoints = [
    [285, 106],
    [413, 106],
    [289, 241],
    [223, 241],
    [223, 173]
  ];
  const topWingMesh = createShapeMesh(topWingPoints, extrudeSettings);

  // 2. Bottom Shape Polygon
  const botShapePoints = [
    [89, 242],
    [222, 242],
    [299, 319],
    [299, 385],
    [232, 385]
  ];
  const botShapeMesh = createShapeMesh(botShapePoints, extrudeSettings);

  // 3. Dot Circle
  const dotPoints = [];
  const segments = 48;
  const cx = 166, cy = 192, r = 28.5;
  for (let i = 0; i < segments; i++) {
    const theta = (i / segments) * Math.PI * 2;
    dotPoints.push([cx + r * Math.cos(theta), cy + r * Math.sin(theta)]);
  }
  const dotMesh = createShapeMesh(dotPoints, {
    ...extrudeSettings,
    depth: 27,
    bevelThickness: 2.5,
    bevelSize: 2.0
  });

  const logoGroup = new THREE.Group();
  const cikkaGroup = new THREE.Group();
  cikkaGroup.add(topWingMesh);
  cikkaGroup.add(botShapeMesh);
  cikkaGroup.add(dotMesh);
  logoGroup.add(cikkaGroup);

  // 3D Rupee Symbol
  function createRupeeMesh() {
    const s = 0.97;
    const ox = -6.5;
    function tx(x) { return x * s + ox; }
    function ty(y) { return -y * s; }

    const shape = new THREE.Shape();
    shape.moveTo(tx(-70.0), ty(-70.7));
    shape.lineTo(tx(18.0), ty(-70.7));
    shape.quadraticCurveTo(tx(16.5), ty(-78.4), tx(13.1), ty(-84.6));
    shape.quadraticCurveTo(tx(9.8), ty(-90.8), tx(3.7), ty(-95.2));
    shape.quadraticCurveTo(tx(-2.3), ty(-99.7), tx(-11.3), ty(-102.1));
    shape.quadraticCurveTo(tx(-20.3), ty(-104.6), tx(-32.6), ty(-104.6));
    shape.lineTo(tx(-70.0), ty(-104.6));
    shape.lineTo(tx(-70.0), ty(-130.0));
    shape.lineTo(tx(93.7), ty(-130.0));
    shape.lineTo(tx(93.7), ty(-104.6));
    shape.lineTo(tx(34.3), ty(-104.6));
    shape.quadraticCurveTo(tx(39.5), ty(-97.9), tx(42.9), ty(-89.5));
    shape.quadraticCurveTo(tx(46.3), ty(-81.1), tx(47.3), ty(-70.7));
    shape.lineTo(tx(93.7), ty(-70.7));
    shape.lineTo(tx(93.7), ty(-45.3));
    shape.lineTo(tx(46.4), ty(-45.3));
    shape.quadraticCurveTo(tx(42.6), ty(-23.6), tx(28.6), ty(-8.3));
    shape.quadraticCurveTo(tx(14.5), ty(7.0), tx(-7.0), ty(12.9));
    shape.lineTo(tx(-7.0), ty(13.6));
    shape.quadraticCurveTo(tx(-0.9), ty(16.5), tx(4.1), ty(20.3));
    shape.quadraticCurveTo(tx(9.3), ty(24.1), tx(14.0), ty(29.1));
    shape.quadraticCurveTo(tx(18.7), ty(34.1), tx(23.3), ty(40.6));
    shape.quadraticCurveTo(tx(27.9), ty(47.1), tx(33.2), ty(55.5));
    shape.lineTo(tx(79.4), ty(130.0));
    shape.lineTo(tx(45.0), ty(130.0));
    shape.lineTo(tx(3.6), ty(60.7));
    shape.quadraticCurveTo(tx(-2.3), ty(50.7), tx(-7.7), ty(43.1));
    shape.quadraticCurveTo(tx(-13.0), ty(35.5), tx(-19.1), ty(30.5));
    shape.quadraticCurveTo(tx(-25.2), ty(25.4), tx(-32.6), ty(22.8));
    shape.quadraticCurveTo(tx(-39.9), ty(20.3), tx(-49.7), ty(20.3));
    shape.lineTo(tx(-70.0), ty(20.3));
    shape.lineTo(tx(-70.0), ty(-4.6));
    shape.lineTo(tx(-32.8), ty(-4.6));
    shape.quadraticCurveTo(tx(-23.6), ty(-4.6), tx(-15.2), ty(-7.5));
    shape.quadraticCurveTo(tx(-6.9), ty(-10.5), tx(-0.3), ty(-15.9));
    shape.quadraticCurveTo(tx(6.4), ty(-21.2), tx(10.9), ty(-28.8));
    shape.quadraticCurveTo(tx(15.6), ty(-36.3), tx(17.6), ty(-45.3));
    shape.lineTo(tx(-70.0), ty(-45.3));
    shape.lineTo(tx(-70.0), ty(-70.7));
    shape.closePath();

    const geom = new THREE.ExtrudeGeometry(shape, {
      depth: 25,
      bevelEnabled: true,
      bevelThickness: 2.4,
      bevelSize: 1.8,
      bevelSegments: 4,
      curveSegments: 24,
      UVGenerator: {
        generateTopUV: function(geometry, vertices, indexA, indexB, indexC) {
          const ax = (vertices[indexA * 3] + 80) / 170;
          const ay = (vertices[indexA * 3 + 1] + 135) / 270;
          const bx = (vertices[indexB * 3] + 80) / 170;
          const by = (vertices[indexB * 3 + 1] + 135) / 270;
          const cx = (vertices[indexC * 3] + 80) / 170;
          const cy = (vertices[indexC * 3 + 1] + 135) / 270;
          return [new THREE.Vector2(ax, ay), new THREE.Vector2(bx, by), new THREE.Vector2(cx, cy)];
        },
        generateSideWallUV: function(geometry, vertices, indexA, indexB, indexC, indexD) {
          return [new THREE.Vector2(0, 0), new THREE.Vector2(1, 0), new THREE.Vector2(1, 1), new THREE.Vector2(0, 1)];
        }
      }
    });

    return new THREE.Mesh(geom, [frontMat, sideMat]);
  }

  const rupeeGroup = new THREE.Group();
  rupeeGroup.add(createRupeeMesh());
  rupeeGroup.visible = false;
  logoGroup.add(rupeeGroup);

  // Exact front-facing position matching photo with subtle 3D depth
  logoGroup.position.set(0, 0, 0);
  logoGroup.rotation.set(0.04, -0.06, 0);
  scene.add(logoGroup);

  // ─── Theme & Mode Controllers ─────────────────────────────────────────
  let targetThemeT = 0.0;
  let currentThemeT = 0.0;

  window.setTheme = function(mode) {
    const btnDark = document.getElementById('btn-theme-dark');
    const btnLight = document.getElementById('btn-theme-light');
    if (mode === 'light') {
      targetThemeT = 1.0;
      body.classList.add('light-theme');
      btnLight.classList.add('active-gold');
      btnDark.classList.remove('active');
    } else {
      targetThemeT = 0.0;
      body.classList.remove('light-theme');
      btnDark.classList.add('active');
      btnLight.classList.remove('active-gold');
    }
  };

  let currentMode = 'cikka';
  let isTransforming = false;
  let transformStartTime = 0;
  const transformDuration = 1000;
  let startRotY = 0;
  let targetRotY = 0;
  let toMode = 'rupee';

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  window.triggerTransformation = function() {
    if (isTransforming) return;
    isTransforming = true;
    transformStartTime = performance.now();
    toMode = currentMode === 'cikka' ? 'rupee' : 'cikka';
    startRotY = logoGroup.rotation.y;
    targetRotY = startRotY + Math.PI * 2;
  };

  // ─── Render Loop ─────────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);

    // Smooth Color Shift interpolation
    if (Math.abs(currentThemeT - targetThemeT) > 0.001) {
      currentThemeT += (targetThemeT - currentThemeT) * 0.06;
      renderGradient(currentThemeT);
      logoTexture.needsUpdate = true;
      sideMat.color = lerpColor(sideDarkColor, sideLightColor, currentThemeT);
    }

    if (isTransforming) {
      const elapsed = performance.now() - transformStartTime;
      const progress = Math.min(elapsed / transformDuration, 1.0);
      const eased = easeInOutCubic(progress);

      logoGroup.rotation.y = startRotY + (targetRotY - startRotY) * eased;

      if (progress < 0.25) {
        cikkaGroup.visible = true;
        rupeeGroup.visible = false;
        cikkaGroup.scale.x = Math.max(0.01, 1 - (progress / 0.25));
      } else {
        cikkaGroup.visible = false;
        rupeeGroup.visible = true;
        rupeeGroup.scale.x = Math.min(1.0, (progress - 0.25) / 0.75);
      }

      if (progress >= 1.0) {
        isTransforming = false;
        currentMode = toMode;
        cikkaGroup.scale.set(1, 1, 1);
        rupeeGroup.scale.set(1, 1, 1);
        cikkaGroup.visible = currentMode === 'cikka';
        rupeeGroup.visible = currentMode === 'rupee';
      }
    } else {
      controls.update();
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
})();
</script>
</body>
</html>

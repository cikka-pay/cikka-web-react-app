<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cikka 3D Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
    }
    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
<div style="position: absolute; top: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(20, 20, 25, 0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 6px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.12); z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
  <button id="btn-cikka" onclick="window.setMode('cikka')" style="padding: 10px 18px; border-radius: 30px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s; background: #7c3aed; color: #fff; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);">Cikka 3D Logo</button>
  <button id="btn-rupee" onclick="window.setMode('rupee')" style="padding: 10px 18px; border-radius: 30px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s; background: transparent; color: rgba(255,255,255,0.7);">Indian Rupee (₹) 3D</button>
  <button id="btn-transform" onclick="window.triggerTransformation()" style="padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(168, 85, 247, 0.4); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s; background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(168, 85, 247, 0.15)); color: #d8b4fe;">↻ Rotate & Transform (Left → Right)</button>
</div>
<div id="canvas-container"></div>
<div class="hint">Drag to rotate 3D &bull; Scroll to zoom</div>

    generateTopUV: function(geometry, vertices, indexA, indexB, indexC) {
      const ax = (vertices[indexA * 3] + 250) / 500;
      const ay = (vertices[indexA * 3 + 1] + 250) / 500;
      const bx = (vertices[indexB * 3] + 250) / 500;
      const by = (vertices[indexB * 3 + 1] + 250) / 500;
      const cx = (vertices[indexC * 3] + 250) / 500;
      const cy = (vertices[indexC * 3 + 1] + 250) / 500;
      return [
        new THREE.Vector2(ax, ay),
        new THREE.Vector2(bx, by),
        new THREE.Vector2(cx, cy)
      ];
    },
    generateSideWallUV: function(geometry, vertices, indexA, indexB, indexC, indexD) {
      return [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(1, 0),
        new THREE.Vector2(1, 1),
        new THREE.Vector2(0, 1)
      ];
    }
  };

  // Continuous brand gradient canvas texture for 3D Rupee (Exact Cikka brand diagonal gradient, 100% matte)
  const rupeeGradCanvas = document.createElement('canvas');
  rupeeGradCanvas.width = 512;
  rupeeGradCanvas.height = 512;
  const rupeeCtx = rupeeGradCanvas.getContext('2d');
  // Linear diagonal gradient matching Cikka logo: top-right (#decff2) to bottom-left (#420b8c)
  const rupeeGrad = rupeeCtx.createLinearGradient(560, -30, 0, 520);
  rupeeGrad.addColorStop(0.00, '#decff2');
  rupeeGrad.addColorStop(0.12, '#c4b1e5');
  rupeeGrad.addColorStop(0.28, '#a682db');
  rupeeGrad.addColorStop(0.48, '#8e5ccf');
  rupeeGrad.addColorStop(0.68, '#7337bd');
  rupeeGrad.addColorStop(0.85, '#591cb0');
  rupeeGrad.addColorStop(1.00, '#420b8c');
  rupeeCtx.fillStyle = rupeeGrad;
  rupeeCtx.fillRect(0, 0, 512, 512);

  const rupeeTexture = new THREE.CanvasTexture(rupeeGradCanvas);
  rupeeTexture.encoding = THREE.sRGBEncoding;

  const rupeeFrontMat = new THREE.MeshStandardMaterial({
    map: rupeeTexture,
    roughness: 1.0,
    metalness: 0.0
  });

  const rupeeSideMat = new THREE.MeshStandardMaterial({
    color: 0x380c5e,
    roughness: 1.0,
    metalness: 0.0
  });

  const rupeeUVGenerator = {
    generateTopUV: function(geometry, vertices, indexA, indexB, indexC) {
      const ax = (vertices[indexA * 3] + 80) / 170;
      const ay = (vertices[indexA * 3 + 1] + 135) / 270;
      const bx = (vertices[indexB * 3] + 80) / 170;
      const by = (vertices[indexB * 3 + 1] + 135) / 270;
      const cx = (vertices[indexC * 3] + 80) / 170;
      const cy = (vertices[indexC * 3 + 1] + 135) / 270;
      return [
        new THREE.Vector2(ax, ay),
        new THREE.Vector2(bx, by),
        new THREE.Vector2(cx, cy)
      ];
    },
    generateSideWallUV: function(geometry, vertices, indexA, indexB, indexC, indexD) {
      return [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(1, 0),
        new THREE.Vector2(1, 1),
        new THREE.Vector2(0, 1)
      ];
    }
  };

  function createShapeMesh(points, extrudeOpts) {
    const shape = new THREE.Shape();
    const p0 = to3D(points[0][0], points[0][1]);
    shape.moveTo(p0[0], p0[1]);
    for (let i = 1; i < points.length; i++) {
      const p = to3D(points[i][0], points[i][1]);
      shape.lineTo(p[0], p[1]);
    }
    shape.closePath();

    const geom = new THREE.ExtrudeGeometry(shape, {
      ...extrudeOpts,
      UVGenerator: pixelPerfectUVGenerator
    });

    return new THREE.Mesh(geom, [frontMat, sideMat]);
  }

  // 1. Top Wing Polygon
  const topWingPoints = [
    [285, 106],
    [413, 106],
    [289, 241],
    [223, 241],
    [223, 173]
  ];
  const topWingMesh = createShapeMesh(topWingPoints, extrudeSettings);

  // 2. Bottom Shape Polygon
  const botShapePoints = [
    [89, 242],
    [222, 242],
    [299, 319],
    [299, 385],
    [232, 385]
  ];
  const botShapeMesh = createShapeMesh(botShapePoints, extrudeSettings);

  // 3. Dot Circle
  const dotPoints = [];
  const segments = 48;
  const cx = 166, cy = 192, r = 28.5;
  for (let i = 0; i < segments; i++) {
    const theta = (i / segments) * Math.PI * 2;
    dotPoints.push([cx + r * Math.cos(theta), cy + r * Math.sin(theta)]);
  }
  const dotMesh = createShapeMesh(dotPoints, {
    ...extrudeSettings,
    depth: 27,
    bevelThickness: 2.5,
    bevelSize: 2.0
  });

  // Group 1: 3D Cikka Logo
  const cikkaGroup = new THREE.Group();
  cikkaGroup.add(topWingMesh);
  cikkaGroup.add(botShapeMesh);
  cikkaGroup.add(dotMesh);
  logoGroup.add(cikkaGroup);

  // Group 2: 3D Indian Rupee Symbol (Exact same brand color, gradient, bevel, and extrusion)
  function createRupeeMesh() {
    const s = 0.97;
    const ox = -6.5; // Centered precisely in 500x500 space

    function tx(x) { return x * s + ox; }
    function ty(y) { return -y * s; } // Negate Y so SVG Y-down maps to Three.js Y-up

    const shape = new THREE.Shape();
    shape.moveTo(tx(-70.0), ty(-70.7));
    shape.lineTo(tx(18.0), ty(-70.7));
    shape.quadraticCurveTo(tx(16.5), ty(-78.4), tx(13.1), ty(-84.6));
    shape.quadraticCurveTo(tx(9.8), ty(-90.8), tx(3.7), ty(-95.2));
    shape.quadraticCurveTo(tx(-2.3), ty(-99.7), tx(-11.3), ty(-102.1));
    shape.quadraticCurveTo(tx(-20.3), ty(-104.6), tx(-32.6), ty(-104.6));
    shape.lineTo(tx(-70.0), ty(-104.6));
    shape.lineTo(tx(-70.0), ty(-130.0));
    shape.lineTo(tx(93.7), ty(-130.0));
    shape.lineTo(tx(93.7), ty(-104.6));
    shape.lineTo(tx(34.3), ty(-104.6));
    shape.quadraticCurveTo(tx(39.5), ty(-97.9), tx(42.9), ty(-89.5));
    shape.quadraticCurveTo(tx(46.3), ty(-81.1), tx(47.3), ty(-70.7));
    shape.lineTo(tx(93.7), ty(-70.7));
    shape.lineTo(tx(93.7), ty(-45.3));
    shape.lineTo(tx(46.4), ty(-45.3));
    shape.quadraticCurveTo(tx(42.6), ty(-23.6), tx(28.6), ty(-8.3));
    shape.quadraticCurveTo(tx(14.5), ty(7.0), tx(-7.0), ty(12.9));
    shape.lineTo(tx(-7.0), ty(13.6));
    shape.quadraticCurveTo(tx(-0.9), ty(16.5), tx(4.1), ty(20.3));
    shape.quadraticCurveTo(tx(9.3), ty(24.1), tx(14.0), ty(29.1));
    shape.quadraticCurveTo(tx(18.7), ty(34.1), tx(23.3), ty(40.6));
    shape.quadraticCurveTo(tx(27.9), ty(47.1), tx(33.2), ty(55.5));
    shape.lineTo(tx(79.4), ty(130.0));
    shape.lineTo(tx(45.0), ty(130.0));
    shape.lineTo(tx(3.6), ty(60.7));
    shape.quadraticCurveTo(tx(-2.3), ty(50.7), tx(-7.7), ty(43.1));
    shape.quadraticCurveTo(tx(-13.0), ty(35.5), tx(-19.1), ty(30.5));
    shape.quadraticCurveTo(tx(-25.2), ty(25.4), tx(-32.6), ty(22.8));
    shape.quadraticCurveTo(tx(-39.9), ty(20.3), tx(-49.7), ty(20.3));
    shape.lineTo(tx(-70.0), ty(20.3));
    shape.lineTo(tx(-70.0), ty(-4.6));
    shape.lineTo(tx(-32.8), ty(-4.6));
    shape.quadraticCurveTo(tx(-23.6), ty(-4.6), tx(-15.2), ty(-7.5));
    shape.quadraticCurveTo(tx(-6.9), ty(-10.5), tx(-0.3), ty(-15.9));
    shape.quadraticCurveTo(tx(6.4), ty(-21.2), tx(10.9), ty(-28.8));
    shape.quadraticCurveTo(tx(15.6), ty(-36.3), tx(17.6), ty(-45.3));
    shape.lineTo(tx(-70.0), ty(-45.3));
    shape.lineTo(tx(-70.0), ty(-70.7));
    shape.closePath();

    const geom = new THREE.ExtrudeGeometry(shape, {
      depth: 25,
      bevelEnabled: true,
      bevelThickness: 2.4,
      bevelSize: 1.8,
      bevelSegments: 4,
      curveSegments: 24,
      UVGenerator: rupeeUVGenerator
    });

    const mesh = new THREE.Mesh(geom, [rupeeFrontMat, rupeeSideMat]);
    mesh.castShadow = true;
    mesh.receiveShadow = false;
    return mesh;
  }

  const rupeeGroup = new THREE.Group();
  const rupeeMesh = createRupeeMesh();
  rupeeGroup.add(rupeeMesh);
  rupeeGroup.visible = false;
  logoGroup.add(rupeeGroup);

  // Initial clean resting position with subtle 3D perspective tilt
  logoGroup.position.set(0, 0, -12);
  logoGroup.rotation.set(0.08, -0.15, 0);
  scene.add(logoGroup);

  // ─── OrbitControls (Stable — No Auto-Rotation) ────────
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.8;
  controls.minDistance = 300;
  controls.maxDistance = 1200;

  // ─── Transformation Controller (Left-to-Right 3D Rotation) ─────
  let currentMode = 'cikka';
  let isTransforming = false;
  let transformStartTime = 0;
  const transformDuration = 1000; // ms
  let startRotY = 0;
  let targetRotY = 0;
  let toMode = 'rupee';

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  function updateUIButtons(mode) {
    const btnCikka = document.getElementById('btn-cikka');
    const btnRupee = document.getElementById('btn-rupee');
    if (!btnCikka || !btnRupee) return;
    if (mode === 'cikka') {
      btnCikka.style.background = '#7c3aed';
      btnCikka.style.color = '#fff';
      btnCikka.style.boxShadow = '0 4px 14px rgba(124, 58, 237, 0.4)';
      btnRupee.style.background = 'transparent';
      btnRupee.style.color = 'rgba(255,255,255,0.7)';
      btnRupee.style.boxShadow = 'none';
    } else {
      btnRupee.style.background = '#7c3aed';
      btnRupee.style.color = '#fff';
      btnRupee.style.boxShadow = '0 4px 14px rgba(124, 58, 237, 0.4)';
      btnCikka.style.background = 'transparent';
      btnCikka.style.color = 'rgba(255,255,255,0.7)';
      btnCikka.style.boxShadow = 'none';
    }
  }

  function startTransformTo(target) {
    if (isTransforming) return;
    if (currentMode === target) return;
    isTransforming = true;
    transformStartTime = performance.now();
    toMode = target;
    startRotY = logoGroup.rotation.y;
    // Left-to-right continuous rotation: spin by +360 degrees
    targetRotY = startRotY + Math.PI * 2;
    updateUIButtons(toMode);
  }

  window.setMode = function(mode) {
    startTransformTo(mode);
  };

  window.triggerTransformation = function() {
    if (isTransforming) return;
    const next = currentMode === 'cikka' ? 'rupee' : 'cikka';
    startTransformTo(next);
  };

  if (window.location.hash === '#rupee') {
    currentMode = 'rupee';
    cikkaGroup.visible = false;
    rupeeGroup.visible = true;
    updateUIButtons('rupee');
  }

  // ─── Render Loop ─────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);

    if (isTransforming) {
      const elapsed = performance.now() - transformStartTime;
      const progress = Math.min(elapsed / transformDuration, 1.0);
      const eased = easeInOutCubic(progress);

      // Smooth left-to-right rotation
      logoGroup.rotation.y = startRotY + (targetRotY - startRotY) * eased;

      // At edge-on orientation (~90° / progress 0.25), morph seamlessly
      if (progress < 0.25) {
        cikkaGroup.visible = true;
        rupeeGroup.visible = false;
        cikkaGroup.scale.x = Math.max(0.01, 1 - (progress / 0.25));
      } else {
        cikkaGroup.visible = false;
        rupeeGroup.visible = true;
        rupeeGroup.scale.x = Math.min(1.0, (progress - 0.25) / 0.75);
      }

      if (progress >= 1.0) {
        isTransforming = false;
        currentMode = toMode;
        cikkaGroup.scale.set(1, 1, 1);
        rupeeGroup.scale.set(1, 1, 1);
        if (currentMode === 'cikka') {
          cikkaGroup.visible = true;
          rupeeGroup.visible = false;
        } else {
          cikkaGroup.visible = false;
          rupeeGroup.visible = true;
        }
      }
    } else {
      controls.update();
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });

})();
</script>
</body>
</html>
